apply plugin: 'com.android.application'

def mairideReleaseStoreFile = project.findProperty("MAIRIDE_RELEASE_STORE_FILE") ?: System.getenv("MAIRIDE_RELEASE_STORE_FILE")
def mairideReleaseStorePassword = project.findProperty("MAIRIDE_RELEASE_STORE_PASSWORD") ?: System.getenv("MAIRIDE_RELEASE_STORE_PASSWORD")
def mairideReleaseKeyAlias = project.findProperty("MAIRIDE_RELEASE_KEY_ALIAS") ?: System.getenv("MAIRIDE_RELEASE_KEY_ALIAS")
def mairideReleaseKeyPassword = project.findProperty("MAIRIDE_RELEASE_KEY_PASSWORD") ?: System.getenv("MAIRIDE_RELEASE_KEY_PASSWORD")
def hasMairideReleaseSigning = mairideReleaseStoreFile && mairideReleaseStorePassword && mairideReleaseKeyAlias && mairideReleaseKeyPassword

android {
    namespace = "in.mairide.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.mairide.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 288
        versionName "v3.0.1-beta+build.288"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:*.map'
        }
    }
    signingConfigs {
        release {
            if (hasMairideReleaseSigning) {
                storeFile file(mairideReleaseStoreFile)
                storePassword mairideReleaseStorePassword
                keyAlias mairideReleaseKeyAlias
                keyPassword mairideReleaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            debuggable false
            if (hasMairideReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk false
        }
    }
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

tasks.register("trimBundledWebPayload", Delete) {
    delete "${projectDir}/src/main/assets/public/downloads"
    delete "${projectDir}/src/main/assets/public/tutorials/videos"
    delete fileTree("${projectDir}/src/main/res") {
        include "**/* 2.*"
    }
}

preBuild.dependsOn("trimBundledWebPayload")

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
